name: tsc

on:
  push:
    branches: [main]

jobs:
  tsc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: link-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: link-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
